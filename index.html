<!DOCTYPE html>
<html>
<head>
  <title>Nuvraverse CI/CD</title>
  <style>
    body {
      background: #0a0a0f;
      color: #f4f0e8;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 { color: #c9a84c; font-size: 48px; }
    p { color: #6b6560; font-size: 18px; }
    .badge {
      background: #c9a84c;
      color: #0a0a0f;
      padding: 10px 28px;
      font-weight: bold;
      margin-top: 16px;
      display: inline-block;
    }
    .badge2 {
      background: #1a1a2e;
      color: #c9a84c;
      border: 1px solid #c9a84c;
      padding: 10px 28px;
      font-weight: bold;
      margin-top: 12px;
      display: inline-block;
    }
    .version {
      background: #27ae60;
      color: white;
      padding: 10px 28px;
      font-weight: bold;
      margin-top: 12px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div>
    <h1>NUVRAVERSE</h1>
    <p>Richard — Comic Artist & Brand Designer</p>
    <p>Lagos, Nigeria 🌍</p>
    <div class="badge">Deployed via CI/CD Pipeline ⚡</div>
    <br>
    <div class="badge2">GitHub + AWS CodePipeline 🚀</div>
    <br>
    <div class="version">Version 1.0 — Automated Deployment ✅</div>
  </div>
</body>
</html>
